[project]
name = "orca-server-manager"
version = "0.1.0"
description = "Portable Headless Orca Server with Guided Setup, MCP Integration and OCI Deployment"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Login>=0.6.3,<0.7",
  "Flask-WTF>=1.2,<2",
  "gunicorn>=23,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
