name: orca-server-manager
services:
  runtime:
    image: orca-server-manager/runtime-tools:${ORCA_VERSION:-1.4.261}
    platform: linux/amd64
    hostname: orca-runtime
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 1024
    mem_limit: ${ORCA_MEMORY_LIMIT:-4g}
    volumes:
      - runtime-home:/home/orca
      - workspaces:/workspaces
    ports:
      - "${ORCA_BIND_IP:-127.0.0.1}:${ORCA_PORT:-6768}:6768"
  manager:
    image: orca-server-manager/manager-oci:0.2.0
    build:
      context: ..
      dockerfile: container/manager-oci.Dockerfile
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    environment:
      OSM_ORIGIN: ${OSM_ORIGIN:-https://localhost}
      OSM_TRUSTED_HOSTS: ${OSM_TRUSTED_HOSTS:-localhost,127.0.0.1}
      ORCA_WEB_URL: ${ORCA_WEB_URL:-}
      OSM_ORCA_UPSTREAM: runtime:6768
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - manager-data:/data
    ports:
      - "${OSM_BIND_IP:-127.0.0.1}:${OSM_HTTP_PORT:-80}:80"
      - "${OSM_BIND_IP:-127.0.0.1}:${OSM_HTTPS_PORT:-443}:443"
volumes:
  runtime-home:
  workspaces:
  manager-data:
